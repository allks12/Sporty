services:
  db:
    image: postgres:18
    container_name: sporty-project
    restart: unless-stopped
    environment:
      POSTGRES_DB: sportyDB
      POSTGRES_USER: sporty_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
